[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "als-oilmodel"
version = "0.1.0"
description = "Forecast de consumo de amostras e vendas ALS/LS (Microsoft Fabric)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "pyarrow", "openpyxl"]

[project.optional-dependencies]
local = ["pyodbc", "azure-identity", "requests"]
dev = ["pytest"]
ml = ["lightgbm>=4.0"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
